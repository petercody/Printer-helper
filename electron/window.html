<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>raw-print</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --ink: #1b1f24;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #2563eb;
        --ok: #16a34a;
        --bad: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1d21;
          --card: #23272e;
          --ink: #eceff3;
          --muted: #9aa4b2;
          --line: #333a44;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 16px;
      }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      header h1 { font-size: 16px; margin: 0; font-weight: 650; }
      .badge {
        margin-left: auto; font-size: 12px; font-weight: 600;
        padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
      }
      .badge.ok { color: var(--ok); border-color: var(--ok); }
      .badge.bad { color: var(--bad); border-color: var(--bad); }
      .card {
        background: var(--card); border: 1px solid var(--line);
        border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
      }
      .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
      .row .k { color: var(--muted); }
      .row .v { font-variant-numeric: tabular-nums; word-break: break-all; text-align: right; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex; align-items: center; gap: 8px;
        padding: 7px 0; border-bottom: 1px solid var(--line);
      }
      li:last-child { border-bottom: 0; }
      li .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
      li .star { margin-left: auto; font-size: 11px; color: var(--muted); }
      .empty { color: var(--muted); font-style: italic; padding: 6px 0; }
      .actions { display: flex; gap: 8px; }
      button {
        font: inherit; font-weight: 600; cursor: pointer;
        border: 1px solid var(--line); background: var(--card); color: var(--ink);
        padding: 8px 12px; border-radius: 8px;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:active { transform: translateY(1px); }
      pre {
        background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
        padding: 8px; margin: 0; font-size: 11.5px; max-height: 120px; overflow: auto;
        white-space: pre-wrap; color: var(--muted);
      }
      .err { color: var(--bad); }
    </style>
  </head>
  <body>
    <header>
      <h1>raw-print</h1>
      <span id="badge" class="badge">…</span>
    </header>

    <div class="card">
      <div class="row"><span class="k">Endpoint</span><span class="v" id="endpoint">—</span></div>
      <div class="row"><span class="k">Version</span><span class="v" id="version">—</span></div>
      <div class="row" id="errRow" style="display:none"><span class="k err">Error</span><span class="v err" id="err">—</span></div>
    </div>

    <div class="card">
      <h2>Detected printers</h2>
      <ul id="printers"><li class="empty">Loading…</li></ul>
    </div>

    <div class="card">
      <h2>Recent activity</h2>
      <pre id="log">—</pre>
    </div>

    <div class="actions">
      <button class="primary" id="refresh">Refresh</button>
      <button id="config">Edit config</button>
      <button id="restart">Restart</button>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const api = window.rawPrint;
      let defaults = [];

      function applyStatus(s) {
        defaults = s.defaultPrinters || [];
        $("endpoint").textContent = s.running ? `http://localhost:${s.port}` : `(stopped) :${s.port}`;
        $("version").textContent = s.version || "—";
        const badge = $("badge");
        badge.textContent = s.running ? "running" : "stopped";
        badge.className = "badge " + (s.running ? "ok" : "bad");
        if (s.error) {
          $("errRow").style.display = "flex";
          $("err").textContent = s.error;
        } else {
          $("errRow").style.display = "none";
        }
      }

      async function loadPrinters() {
        const ul = $("printers");
        ul.innerHTML = '<li class="empty">Loading…</li>';
        const { printers, error } = await api.listPrinters();
        if (error) {
          ul.innerHTML = `<li class="empty err">${error}</li>`;
          return;
        }
        if (!printers.length) {
          ul.innerHTML = '<li class="empty">No printers found.</li>';
          return;
        }
        ul.innerHTML = "";
        for (const p of printers) {
          const li = document.createElement("li");
          const isDefault = defaults.includes(p.name);
          li.innerHTML =
            `<span class="dot"></span><span>${p.name}</span>` +
            (isDefault ? '<span class="star">default</span>' : "");
          ul.appendChild(li);
        }
      }

      async function refresh() {
        applyStatus(await api.getStatus());
        await loadPrinters();
      }

      $("refresh").onclick = refresh;
      $("config").onclick = () => api.openConfig();
      $("restart").onclick = async () => {
        $("badge").textContent = "restarting…";
        applyStatus(await api.restartAgent());
        await loadPrinters();
      };

      api.onStatus(applyStatus);
      api.onLog((line) => {
        const el = $("log");
        el.textContent = (el.textContent === "—" ? "" : el.textContent + "\n") + line;
        el.scrollTop = el.scrollHeight;
      });

      refresh();
    </script>
  </body>
</html>
