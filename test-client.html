<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>raw-print · test client</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
      h1 { font-size: 20px; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      input[type="text"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }
      button { margin-top: 18px; padding: 10px 18px; font-size: 15px; cursor: pointer; border: 0; border-radius: 6px; background: #1a1a1a; color: #fff; }
      button.secondary { background: #555; }
      button:disabled { opacity: .5; cursor: default; }
      #out { margin-top: 18px; padding: 12px; border-radius: 6px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; }
      .ok { background: #e7f6ec; } .err { background: #fdeaea; }
      .row { display: flex; gap: 10px; align-items: flex-end; border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
      .row > div { flex: 1; }
      .row button.remove { margin-top: 0; padding: 8px 10px; background: #b00020; }
      small { color: #666; }
    </style>
  </head>
  <body>
    <h1>raw-print · test client</h1>
    <p><small>Open this page on the machine connected to the printers. Add one row per file/printer — any number works.</small></p>

    <label>Agent URL</label>
    <input id="url" type="text" value="http://localhost:9100" />

    <div id="rows"></div>

    <button id="addRow" class="secondary" type="button">+ Add another file</button>
    <button id="go">Print all</button>
    <button id="list" class="secondary">List printers</button>

    <div id="out"></div>

    <template id="rowTpl">
      <div class="row">
        <div>
          <label>Printer (optional)</label>
          <input class="printer" type="text" placeholder="uses .env default if blank" />
        </div>
        <div>
          <label>File (PDF)</label>
          <input class="file" type="file" accept="application/pdf" />
        </div>
        <button class="remove" type="button" title="Remove">✕</button>
      </div>
    </template>

    <script>
      const $ = (id) => document.getElementById(id);
      const rows = $("rows");
      const out = $("out");
      const show = (msg, ok) => { out.textContent = msg; out.className = ok ? "ok" : "err"; };

      function addRow() {
        const node = $("rowTpl").content.cloneNode(true);
        node.querySelector(".remove").onclick = (e) => e.target.closest(".row").remove();
        rows.appendChild(node);
      }
      $("addRow").onclick = addRow;
      addRow();
      addRow();

      $("list").onclick = async () => {
        try {
          const r = await fetch($("url").value.replace(/\/$/, "") + "/printers");
          const d = await r.json();
          if (!r.ok) throw new Error(d.error);
          show("Printers:\n" + d.printers.map((p) => "  - " + p.name).join("\n"), true);
        } catch (e) { show("Error: " + e.message, false); }
      };

      $("go").onclick = async () => {
        const entries = [...rows.querySelectorAll(".row")].map((row) => ({
          file: row.querySelector(".file").files[0],
          printer: row.querySelector(".printer").value.trim(),
        }));
        const withFiles = entries.filter((e) => e.file);
        if (!withFiles.length) return show("Pick at least one file.", false);

        const btn = $("go"); btn.disabled = true; show("Printing…", true);
        try {
          const fd = new FormData();
          withFiles.forEach((e) => fd.append("files", e.file));
          // Only send "printers" if every row has one; otherwise fall back to .env defaults.
          if (withFiles.every((e) => e.printer)) {
            fd.append("printers", JSON.stringify(withFiles.map((e) => e.printer)));
          }
          const r = await fetch($("url").value.replace(/\/$/, "") + "/print", { method: "POST", body: fd });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error);
          show("Sent:\n" + JSON.stringify(d.printed, null, 2), true);
        } catch (e) { show("Error: " + e.message, false); }
        finally { btn.disabled = false; }
      };
    </script>
  </body>
</html>
