<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>raw-print · test client</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
      h1 { font-size: 20px; }
      label { display: block; margin: 16px 0 4px; font-weight: 600; }
      input[type="text"], input[type="file"], select, textarea {
        width: 100%; padding: 8px; box-sizing: border-box; font: inherit;
      }
      textarea { font-family: ui-monospace, monospace; }
      button { margin-top: 18px; padding: 10px 18px; font-size: 15px; cursor: pointer; border: 0; border-radius: 6px; background: #1a1a1a; color: #fff; }
      button.secondary { background: #555; }
      button:disabled { opacity: .5; cursor: default; }
      #out { margin-top: 18px; padding: 12px; border-radius: 6px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; }
      .ok { background: #e7f6ec; } .err { background: #fdeaea; }
      small { color: #666; }
      .seg { display: inline-flex; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
      .seg button { margin: 0; border-radius: 0; background: #fff; color: #1a1a1a; padding: 8px 20px; }
      .seg button.active { background: #1a1a1a; color: #fff; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>raw-print · test client</h1>
    <p><small>Open this page on the machine connected to the printers.</small></p>

    <label>Agent URL</label>
    <input id="url" type="text" value="http://localhost:9100" />

    <label>Send</label>
    <div class="seg" id="mode">
      <button data-mode="pdf" class="active" type="button">PDF</button>
      <button data-mode="raw" type="button">RAW (ZPL/SBPL)</button>
    </div>

    <label>Printer <small id="printerHint">(loaded from the agent)</small></label>
    <select id="printer"><option value="">Loading printers…</option></select>

    <div id="pdfPane">
      <label>File (PDF)</label>
      <input id="pdfFile" type="file" accept="application/pdf" />
    </div>

    <div id="rawPane" class="hidden">
      <label>Raw payload</label>
      <textarea id="rawData" rows="6">^XA^FO50,50^A0N,40,40^FDraw-print test^FS^XZ</textarea>
    </div>

    <button id="go">Print</button>
    <button id="reload" class="secondary" type="button">Reload printers</button>

    <div id="out"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const out = $("out");
      const show = (msg, ok) => { out.textContent = msg; out.className = ok ? "ok" : "err"; };
      const base = () => $("url").value.replace(/\/$/, "");

      let mode = "pdf";

      // --- Mode toggle (PDF / RAW) --------------------------------------------
      $("mode").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-mode]");
        if (!btn) return;
        mode = btn.dataset.mode;
        [...$("mode").children].forEach((b) => b.classList.toggle("active", b === btn));
        $("pdfPane").classList.toggle("hidden", mode !== "pdf");
        $("rawPane").classList.toggle("hidden", mode !== "raw");
      });

      // --- Load the printer list from the agent -------------------------------
      async function loadPrinters() {
        const sel = $("printer");
        sel.innerHTML = '<option value="">Loading printers…</option>';
        try {
          const r = await fetch(base() + "/printers");
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || "Failed to list printers");
          const names = (d.printers || []).map((p) => p.name);
          if (!names.length) {
            sel.innerHTML = '<option value="">No printers found</option>';
            return;
          }
          sel.innerHTML =
            '<option value="">— select a printer —</option>' +
            names.map((n) => `<option value="${n.replace(/"/g, "&quot;")}">${n}</option>`).join("");
        } catch (e) {
          sel.innerHTML = '<option value="">Agent not reachable</option>';
          show("Could not load printers: " + e.message, false);
        }
      }
      $("reload").onclick = loadPrinters;
      $("url").addEventListener("change", loadPrinters);
      loadPrinters();

      // --- Print --------------------------------------------------------------
      $("go").onclick = async () => {
        const printer = $("printer").value;
        if (!printer) return show("Select a printer first.", false);

        const btn = $("go"); btn.disabled = true; show("Printing…", true);
        try {
          let r, d;
          if (mode === "pdf") {
            const file = $("pdfFile").files[0];
            if (!file) { show("Pick a PDF file.", false); return; }
            const fd = new FormData();
            fd.append("files", file);
            fd.append("jobs", JSON.stringify([{ file: file.name, printer }]));
            r = await fetch(base() + "/print", { method: "POST", body: fd });
          } else {
            const data = $("rawData").value;
            if (!data) { show("Enter a raw payload.", false); return; }
            r = await fetch(base() + "/print-raw", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ data, printer }),
            });
          }
          d = await r.json();
          if (!r.ok) throw new Error(d.error);
          show("Sent:\n" + JSON.stringify(d.printed, null, 2), true);
        } catch (e) { show("Error: " + e.message, false); }
        finally { btn.disabled = false; }
      };
    </script>
  </body>
</html>
