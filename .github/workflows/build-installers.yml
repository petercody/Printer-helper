name: Build installers

# Build the Windows .exe and macOS .dmg on real runners — no Wine, no local
# Windows/Mac machine needed. Both jobs run in parallel.
on:
  push:
    tags:
      - "v*"          # push a tag like v1.0.0 to cut a release
  workflow_dispatch:   # or run it manually from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist -- --publish never

      # Grab the installer from every manual/branch run.
      # electron-builder writes to release/ (directories.output in package.json),
      # not dist/ — dist/ only holds the compiled TypeScript.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: raw-print-windows
          path: release/*.exe

      # When you push a version tag, also attach the .exe to a GitHub Release.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # Unsigned build. CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder
      # from hunting for a signing certificate on the runner.
      - name: Build installer
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Grab the .dmg (and .zip) from every manual/branch run.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: raw-print-mac
          path: |
            release/*.dmg
            release/*.zip

      # When you push a version tag, also attach the .dmg/.zip to the Release.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
