name: Build Windows installer

# Build the .exe on a real Windows runner — no Wine / no local Windows PC needed.
on:
  push:
    tags:
      - "v*"          # push a tag like v1.0.0 to cut a release
  workflow_dispatch:   # or run it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist

      # Grab the installer from every manual/branch run.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-print-windows
          path: dist/*.exe

      # When you push a version tag, also attach the .exe to a GitHub Release.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
